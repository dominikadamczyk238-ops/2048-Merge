<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micronym Merge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: 'Inter', sans-serif !important; user-select: none; }
    body { background: hsl(calc(240deg + var(--tier) - 1deg), 100%, 50%); color: rgba(255,255,255,0.858); font-weight: 700; display: flex; flex-direction: column; align-items: center; padding: 25px; }
    #s { font-size: 30px; letter-spacing: 2px; margin-bottom: 5px; text-align: center; white-space: pre-line; }
    #p { color: #33ff00; font-size: 16px; margin-bottom: 15px; letter-spacing: 1px; animation: blink 1.5s infinite; text-align: center; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
    button, select { padding: 10px 15px; font-weight: 700; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 1px; transition: .15s; font-family: inherit; }
    #uBtn { background: #981eef; color: #1c1c24; }
    #resetBtn { background: #ff4757; color: white; }
    button:hover:not(:disabled) { transform: scale(1.04); }
    button:active:not(:disabled) { transform: scale(.96); }
    #uBtn:disabled { opacity: .45; cursor: not-allowed; }
    #g { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; background: #1c1c24; padding: 15px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.4); width: 100%; max-width: 1200px; }
    .tile { width: 100%; aspect-ratio: 1/1; border-radius: 0; padding: 0; cursor: pointer; overflow: hidden; position: relative; transition: transform .12s, filter .12s, box-shadow .12s; }
    .tile:hover { transform: scale(1.025); filter: brightness(1.1); }
    .tile.empty { background: #282833; cursor: default; }
    .tile.selected { transform: scale(.9); outline: 3px solid white; outline-offset: -3px; }
  </style>
</head>

<script>
// Notation Classes
class Roman {
  constructor() {
    this.z = 4e12; 
    this.B = Math.log10(this.z);
    this.frac = ["", "·", ":", "∴", "∷", "⁙", "S", "S·", "S:", "S∴", "S∷", "S⁙"];
    this.F = [
      [1e12, "M\u033F\u0305"],
      [9e11, "C\u033F\u0305M\u033F\u0305"],
      [5e11, "D\u033F\u0305"],
      [4e11, "C\u033F\u0305D\u033F\u0305"],
      [1e11, "C\u033F\u0305"],
      [9e10, "X\u033F\u0305C\u033F\u0305"],
      [5e10, "L\u033F\u0305"],
      [4e10, "X\u033F\u0305L\u033F\u0305"],
      [1e10, "X\u033F\u0305"],
      [9e9,  "M\u033FX\u033F\u0305"],
      [5e9,  "V\u033F\u0305"],
      [4e9,  "M\u033FV\u033F\u0305"],
      
      [1e9,"M\u033F"],[9e8,"C\u033FM\u033F"],[5e8,"D̿"],[4e8,"C̿D̿"],[1e8,"C̿"],
      [9e7,"X̿C̿"],[5e7,"L̿"],[4e7,"X̿L̿"],[1e7,"X̿"],[9e6,"M̿X̿"],[5e6,"V̿"],
      [4e6,"M̄V̿"],[1e6,"M̄"],[9e5,"C̄M̄"],[5e5,"D̄"],[4e5,"C̄D̄"],[1e5,"C̄"],
      [9e4,"X̄C̄"],[5e4,"L̄"],[4e4,"X̄L̄"],[1e4,"X̄"],[9e3,"MX̄"],[5e3,"V̄"],
      [4e3,"MV̄"],[1e3,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],
      [90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]
    ];
  }

  format(value) {
    let t = value; 
    let out = "";

    // Pętla zamieniająca część całkowitą na cyfry rzymskie
    for (const [val, symbol] of this.F) { 
      while (t >= val) { 
        out += symbol; 
        t -= val; 
      } 
    }

    // Ułamki rzymskie (dwunastkowe) bazujące na Twoim wzorze
    let a = Math.round(1.2 * Math.floor(10 * t));
    if (a === 0) return out === "" ? "nulla" : out;
    if (a >= this.frac.length) return out; // Bezpiecznik przed wyjściem poza tablicę
    return out + this.frac[a];
  }

  formatDecimal(n) {
    // n to obiekt typu Decimal posiadający mantysę (n.m) oraz wykładnik (n.e)
    const value = n.m * Math.pow(10, n.e);
    
    // Jeśli liczba jest mniejsza niż 4e9, formatujemy ją normalnie
    if (value < this.z) return this.format(value);
    
    // Wykładnik potęgowy dla ogromnych liczb (Antimatter Dimensions)
    const log10 = Math.log10(n.m) + n.e;
    const N = log10 / this.B;
    const r = Math.pow(this.z, N - Math.floor(N));
    
    // Rekurencyjnie formatujemy bazę oraz potęgę po strzałce ↑
    return this.format(r) + "↑" + this.formatDecimal({m: N, e: 0});
  }
}

class Chemical {
  static formatChemicalNumber(value) {
    if (value == null) return "0.00";
    let exponent = Number(value.e ?? value.exponent);
    let mantissa = Number(value.m ?? value.mantissa);
    if (!Number.isFinite(exponent) || !Number.isFinite(mantissa)) {
      const logarithm = typeof value.log10 === "function" ? Number(value.log10()) : NaN;
      if (!Number.isFinite(logarithm)) return "0.00";
      exponent = Math.floor(logarithm); mantissa = Math.pow(10, logarithm - exponent);
    }
    if (mantissa === 0) return "0.00";
    const step = Math.floor(exponent / 3);
    const scaledMantissa = mantissa * Math.pow(10, exponent - step * 3);
    let suffix = "";
    if (step >= 1 && step <= Chemical.chemicalElements.length) suffix = Chemical.chemicalElements[step - 1];
    else if (step > Chemical.chemicalElements.length) {
      let index = step - Chemical.chemicalElements.length - 1;
      const base = Chemical.chemicalElements.length;
      suffix = Chemical.chemicalElements[Math.floor(index/base)] + "-" + Chemical.chemicalElements[index % base];
    }
    return scaledMantissa.toFixed(2) + (suffix ? " " + suffix : "");
  }
}
Chemical.chemicalElements = ["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu","Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn","Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No","Lr","Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"];
class IsotopeNotation {
  static formatChemicalNumber(value) {
    if (value == null) return "0.00";
    let exponent = Number(value.e ?? value.exponent);
    let mantissa = Number(value.m ?? value.mantissa);
    if (!Number.isFinite(exponent) || !Number.isFinite(mantissa)) {
      const logarithm = typeof value.log10 === "function" ? Number(value.log10()) : NaN;
      if (!Number.isFinite(logarithm)) return "0.00";
      exponent = Math.floor(logarithm); mantissa = Math.pow(10, logarithm - exponent);
    }
    if (mantissa === 0) return "0.00";
    const step = Math.floor(exponent / 3);
    const scaledMantissa = mantissa * Math.pow(10, exponent - step * 3);
    let suffix = "";
    if (step >= 1 && step <= IsotopeNotation.chemicalElements.length) {
      suffix = IsotopeNotation.chemicalElements[step - 1];
    } else if (step > IsotopeNotation.chemicalElements.length) {
      let index = step - IsotopeNotation.chemicalElements.length - 1;
      const base = IsotopeNotation.chemicalElements.length;
      suffix = IsotopeNotation.chemicalElements[Math.floor(index / base)] + "-" + IsotopeNotation.chemicalElements[index % base];
    }
    return scaledMantissa.toFixed(2) + (suffix ? " " + suffix : "");
  }

  static _generateSortedIsotopes() {
    const data = [
      ["H", 1, 2, 3], ["He", 3, 10], ["Li", 4, 13], ["Be", 6, 17], ["B", 7, 21], ["C", 8, 22], ["N", 10, 25], ["O", 11, 28], ["F", 14, 31], ["Ne", 15, 34],
      ["Na", 18, 39], ["Mg", 19, 40], ["Al", 21, 43], ["Si", 22, 44], ["P", 24, 46], ["S", 26, 49], ["Cl", 28, 51], ["Ar", 30, 54], ["K", 32, 57], ["Ca", 34, 59],
      ["Sc", 36, 61], ["Ti", 38, 64], ["V", 40, 66], ["Cr", 42, 68], ["Mn", 44, 70], ["Fe", 45, 74], ["Co", 47, 76], ["Ni", 48, 82], ["Cu", 52, 81], ["Zn", 54, 85],
      ["Ga", 56, 87], ["Ge", 58, 90], ["As", 60, 92], ["Se", 64, 95], ["Br", 66, 98], ["Kr", 69, 101], ["Rb", 71, 103], ["Sr", 73, 106], ["Y", 76, 109], ["Zr", 78, 112],
      ["Nb", 81, 115], ["Mo", 83, 118], ["Tc", 85, 122], ["Ru", 87, 125], ["Rh", 89, 128], ["Pd", 91, 131], ["Ag", 93, 134], ["Cd", 95, 138], ["In", 97, 141], ["Sn", 99, 143],
      ["Sb", 103, 145], ["Te", 104, 147], ["I", 108, 149], ["Xe", 108, 151], ["Cs", 112, 154], ["Ba", 114, 157], ["La", 116, 160], ["Ce", 119, 162], ["Pr", 121, 164], ["Nd", 124, 167],
      ["Pm", 126, 169], ["Sm", 128, 171], ["Eu", 130, 173], ["Gd", 132, 175], ["Tb", 135, 177], ["Dy", 138, 180], ["Ho", 140, 182], ["Er", 143, 185], ["Tm", 145, 187], ["Yb", 148, 190],
      ["Lu", 150, 192], ["Hf", 153, 195], ["Ta", 155, 197], ["W", 158, 200], ["Re", 160, 202], ["Os", 162, 204], ["Ir", 164, 207], ["Pt", 166, 210], ["Au", 169, 213], ["Hg", 171, 216],
      ["Tl", 176, 218], ["Pb", 178, 220], ["Bi", 184, 222], ["Po", 188, 224], ["At", 191, 226], ["Rn", 193, 231], ["Fr", 199, 233], ["Ra", 201, 235], ["Ac", 205, 237], ["Th", 207, 239],
      ["Pa", 212, 241], ["U", 215, 243], ["Np", 219, 245], ["Pu", 228, 247], ["Am", 232, 249], ["Cm", 233, 252], ["Bk", 235, 254], ["Cf", 237, 256], ["Es", 240, 258], ["Fm", 242, 260],
      ["Md", 244, 262], ["No", 248, 264], ["Lr", 251, 266], ["Rf", 253, 268], ["Db", 255, 270], ["Sg", 258, 272], ["Bh", 260, 274], ["Hs", 263, 277], ["Mt", 265, 279], ["Ds", 267, 282],
      ["Rg", 272, 284], ["Cn", 277, 286], ["Nh", 278, 288], ["Fl", 282, 290], ["Mc", 284, 292], ["Lv", 288, 294], ["Ts", 291, 295], ["Og", 293, 295]
    ];
    const rawList = [];
    for (const [symbol, min, max] of data) {
      for (let mass = min; mass <= max; mass++) {
        rawList.push({ mass, symbol });
      }
    }
    rawList.sort((a, b) => a.mass - b.mass || a.symbol.localeCompare(b.symbol));
    return rawList.map(item => `${item.mass}${item.symbol}`);
  }
} // <--- TUTAJ JEST KOŃCOWA KLAMRA ZAMYKAJĄCA KLASĘ

// Przypisanie wygenerowanej tablicy do pola statycznego
IsotopeNotation.chemicalElements = IsotopeNotation._generateSortedIsotopes();
class FullEnglishNotation {
  constructor() {
    this.basicIllions = [
      "million", "billion", "trillion", "quadrillion", "quintillion", 
      "sextillion", "septillion", "octillion", "nonillion", "decillion"
    ];

    this.units = ["", "un", "duo", "tres", "quattuor", "quinque", "se", "septem", "octo", "novem"];
    this.tens = ["", "deci", "viginti", "triginta", "quadraginta", "quinquaginta", "sexaginta", "septuaginta", "octoginta", "nonaginta"];
    this.hundreds = ["", "centi", "ducenti", "trecenti", "quadringenti", "quingenti", "sescenti", "septingenti", "octingenti", "nongenti"];
  }

  _getSegmentName(index) {
    if (index === 0) return "";
    let u = index % 10;
    let t = Math.floor((index % 100) / 10);
    let h = Math.floor(index / 100);

    let uPrefix = this.units[u];
    let tPrefix = this.tens[t];
    let hPrefix = this.hundreds[h];

    // Reguły Conwaya-Wechslera łączące litery przedrostków
    if (u === 3 && [2, 3, 4, 5, 8].includes(t)) uPrefix = "tres";
    if (u === 6 && [2, 3, 4, 5].includes(t)) uPrefix = "sexi";
    if (u === 6 && (t === 8 || h === 1 || h === 8)) uPrefix = "sex";
    if ([7, 9].includes(u) && [1, 3, 5, 8].includes(t)) uPrefix += "n";
    if ([7, 9].includes(u) && [2, 4, 6, 7].includes(t)) uPrefix += "m"; 
    if ([7, 9].includes(u) && !t && [1, 4, 6, 7].includes(h)) uPrefix += "m";

    return uPrefix + tPrefix + hPrefix;
  }

  _getIllionName(illionIndex) {
    if (illionIndex < this.basicIllions.length) {
      return this.basicIllions[illionIndex];
    }

    let tempIndex = illionIndex;
    let segments = [];
    while (tempIndex > 0) {
      segments.push(tempIndex % 1000);
      tempIndex = Math.floor(tempIndex / 1000);
    }

    let illionName = "";
    for (let i = 0; i < segments.length; i++) {
      let segName = this._getSegmentName(segments[i]);
      if (segName !== "") {
        if (i === 0) {
          illionName = segName + "llion";
        } else {
          let milliPrefix = "milli-".repeat(i);
          illionName = segName + milliPrefix + (illionName ? " " + illionName : "llion");
        }
      }
    }

    return illionName.replace("illionllion", "illion");
  }

  // Przyjmuje obiekt { m, e } jako argument
  format(bigNumber) {
    let { m, e } = bigNumber;

    if (e < 3) {
      return (m * Math.pow(10, e)).toFixed(2);
    }

    const illionIndex = Math.floor(e / 3) - 1;
    const remainder = e % 3;
    const currentMantissa = Math.floor(m * Math.pow(10, remainder));

    // Słowniki do konwersji bazowej liczby przed członem "-illion"
    const numberWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
    const teenWords = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
    const tenWords = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];

    function convertToWords(num) {
      if (num === 0) return "zero";
      
      let words = "";
      if (num >= 100) {
        words += numberWords[Math.floor(num / 100)] + " hundred ";
        num %= 100;
      }
      if (num >= 20) {
        words += tenWords[Math.floor(num / 10)] + (num % 10 !== 0 ? "-" + numberWords[num % 10] : "");
      } else if (num >= 10) {
        words += teenWords[num - 10];
      } else if (num > 0) {
        words += numberWords[num];
      }
      return words.trim();
    }

    const mantissaInWords = convertToWords(currentMantissa);
    const illionName = this._getIllionName(illionIndex);

    return `${mantissaInWords} ${illionName}`;
  }
}

// --- SPRAWDZENIE DZIAŁANIA ---
const english = new FullEnglishNotation();



let notationMode = "scientific";
const RomanFormatter = new Roman();
function fNumRouter({m,e}) {
  if (notationMode === "roman") return RomanFormatter.formatDecimal({m,e});
  if (notationMode === "chemical") return Chemical.formatChemicalNumber({m,e});
  if (notationMode === "isotope") return IsotopeNotation.formatChemicalNumber({m, e});
 if (notationMode === "english") return FullEnglishNotation.formatEnglishNumber({m,e});
  return fNum({m,e});
}

document.addEventListener("DOMContentLoaded", () => {
  const sel = document.getElementById("notationSelect");
  if (sel) sel.addEventListener("change", e => { notationMode = e.target.value; render(); });
});

// Big Number Math
const nNew=(m,e)=>{if(m===0)return{m:0,e:0};const c=Math.floor(Math.log10(Math.abs(m)));return{m:m/Math.pow(10,c),e:e+c};};
const nAdd=(a,b)=>{if(a.m===0)return b;if(b.m===0)return a;const d=a.e-b.e;if(d>15)return a;if(d<-15)return b;return nNew(a.m*Math.pow(10,d)+b.m,b.e);};
const nSub=(a,b)=>{const d=a.e-b.e;if(d>15)return a;if(d<-15)return nNew(-b.m,b.e);return nNew(a.m*Math.pow(10,d)-b.m,b.e);};
const nGte=(a,b)=>{if(a.e!==b.e)return a.e>b.e;return a.m>=b.m;};
const nPow=(base,exponent)=>{if(exponent===0)return{m:1,e:0};const t=exponent*Math.log10(base);const e=Math.floor(t);return nNew(Math.pow(10,t-e),e);};
const fNum=n=>{if(n.m===0)return"0";if(n.e<4)return Math.floor(n.m*Math.pow(10,n.e)).toString();return n.m.toFixed(2)+"e"+n.e;};

// Game State
let coins={m:0,e:0};
let upgradeTier=parseInt(localStorage.getItem("micronym_upgrade"))||0;
let grid=Array(64).fill(1);
try { const savedGrid=JSON.parse(localStorage.getItem("micronym_grid")); if(Array.isArray(savedGrid)&&savedGrid.length===64&&savedGrid.every(t=>Number.isInteger(t)&&t>=0)) grid=savedGrid; } catch(e){}
let selected=null;
let maxTileInRun=parseInt(localStorage.getItem("micronym_run_best"))||1;
let bestTileAllTime=parseInt(localStorage.getItem("micronym_best"))||maxTileInRun;
try { const savedCoins=localStorage.getItem("micronym_coins"); if(savedCoins){const parts=savedCoins.split("e");if(parts.length===2)coins=nNew(parseFloat(parts[0]),parseInt(parts[1]));} } catch(e){}
let Income={m:0,e:0};

function getBase(){ return Math.max(3.02); }
function getCost(){ const power=nPow(getBase(),upgradeTier); const level=Math.max(1,upgradeTier); const divisor=Math.max(1,Math.log(level*Math.log(level+Math.pow(11,Math.log10(level)))+1)); return nNew(power.m*10000/divisor,power.e); }
function getSpawnTier(){ return upgradeTier+1; }
function saveLocal(){ localStorage.setItem("micronym_coins",coins.m+"e"+coins.e); localStorage.setItem("micronym_upgrade",upgradeTier); localStorage.setItem("micronym_grid",JSON.stringify(grid)); localStorage.setItem("micronym_run_best",maxTileInRun); localStorage.setItem("micronym_best",bestTileAllTime); }
function fillBoard(){ const spawn=getSpawnTier(); grid.forEach((x,i)=>{ if(x===0) grid[i]=spawn; if(grid[i]>maxTileInRun) maxTileInRun=grid[i]; }); if(maxTileInRun>bestTileAllTime) bestTileAllTime=maxTileInRun; }

let mergeAllCooldown=false;
function mergeAll(){
  if(mergeAllCooldown) return; mergeAllCooldown=true; let merged=true;
  while(merged){ merged=false; outer:for(let a=0;a<grid.length;a++){ if(grid[a]===0) continue; for(let b=a+1;b<grid.length;b++){ if(grid[b]===grid[a]&&grid[b]>0){ const next=grid[a]+1; grid[a]=0;grid[b]=next; if(next>maxTileInRun) maxTileInRun=next; if(maxTileInRun>bestTileAllTime) bestTileAllTime=maxTileInRun; merged=true;break outer; } } } }
  selected=null;fillBoard();saveLocal();render(); setTimeout(()=>{mergeAllCooldown=false;},10000);
}
document.addEventListener("keydown",(e)=>{ if(e.key.toLowerCase()==="m"&&!e.repeat) mergeAll(); });

function clickTile(index){
  const from=selected;const to=grid[index];
  if(from===null){if(to>0)selected=index;render();return;}
  if(from===index){selected=null;render();return;}
  if(from!==null&&grid[from]===to&&to>0){ const next=grid[from]+1; grid[from]=0;grid[index]=next; if(next>maxTileInRun) maxTileInRun=next; if(maxTileInRun>bestTileAllTime) bestTileAllTime=maxTileInRun; selected=null;fillBoard();saveLocal();render();return; }
  if(to===0){grid[index]=grid[from];grid[from]=0;selected=null;saveLocal();render();return;}
  selected=to>0?index:null;render();
}
function buyUpgrade(){ const cost=getCost(); if(!nGte(coins,cost)) return; coins=nSub(coins,cost);upgradeTier++; const spawn=getSpawnTier(); grid.forEach((x,i)=>{if(x>0&&x<spawn)grid[i]=spawn;}); fillBoard();saveLocal();render(); }
function resetGame(){ if(!confirm("Zresetować run?")) return; coins={m:0,e:0};upgradeTier=0;grid=Array(64).fill(1);selected=null;maxTileInRun=1;bestTileAllTime=1; fillBoard();saveLocal();render(); }

// Render
function render(){
  const spawn=getSpawnTier();const cost=getCost();
  document.body.style.background="hsl("+(bestTileAllTime-1)+", 35%, 50%)";
  document.getElementById("s").innerText="Coins: "+fNumRouter(coins)+"\nYou get "+fNumRouter(Income)+" coin(s) per second.";
  document.getElementById("p").innerText="SPAWN KAFELKÓW: TIER "+spawn;
  const uBtn=document.getElementById("uBtn"); uBtn.innerText="+1 BASE BLOCK (KOSZT: "+fNumRouter(cost)+")"; uBtn.disabled=!nGte(coins,cost);
  const board=document.getElementById("g");board.innerHTML="";
  grid.forEach(function(tileValue,index){
    const tile=document.createElement("div");tile.className="tile";
    if(tileValue===0){tile.classList.add("empty");}
    else{
      if(selected===index) tile.classList.add("selected");
      const tier=tileValue; const fileNum=Math.floor((tier-1)/100)+1; const localIdx=(tier-1)%100; const col=localIdx%10; const row=Math.floor(localIdx/10);
      const displayWidth=tile.offsetWidth||128; const scale=displayWidth/256;
      const mask=document.createElement("div"); mask.style.width=(256*scale)+"px";mask.style.height=(256*scale)+"px"; mask.style.overflow="hidden";mask.style.borderRadius="12px"; mask.style.position="absolute";mask.style.top="50%";mask.style.left="50%"; mask.style.transform="translate(-50%,-50%)";
      const img=document.createElement("div"); img.style.width=(2560*scale)+"px";img.style.height="auto";img.style.aspectRatio="1/1"; img.style.backgroundImage="url('barrels"+fileNum+".png')"; img.style.backgroundSize=(2560*scale)+"px auto"; img.style.backgroundPosition=Math.round(-col*256*scale)+"px "+Math.round(-row*256*scale)+"px";
      mask.appendChild(img);tile.appendChild(mask);
    }
    tile.onclick=(function(i){return function(){clickTile(i);};})(index); board.appendChild(tile);
  });
}

setInterval(()=>{ let newIncome={m:0,e:0}; grid.forEach(tier=>{if(tier>0)newIncome=nAdd(newIncome,nPow(3,tier));}); Income=nNew(newIncome.m,newIncome.e); coins=nAdd(coins,Income); },1000);
setInterval(()=>{render();},1000);

if (grid.every(v => v === 0)) fillBoard();
saveLocal();
render();
</script>
</body>
